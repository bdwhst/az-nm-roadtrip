<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>美西南自驾 · 行程可视化</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#fcfcfb;--panel:#f4f3f0;--line:#e2e1dc;--ink:#0b0b0b;--ink2:#52514e;--ink3:#8a8984;--card:#ffffff;
  --drive:#2a78d6;--play:#eb6834;--meal:#1baf7a;--log:#eda100;--fly:#4a3aa7;--rest:#b9b8b2;--route-dim:#9a9a94;
  --stay:#1f4e79;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1a1a19;--panel:#222221;--line:#3a3a37;--ink:#fff;--ink2:#c3c2b7;--ink3:#8f8e88;--card:#262625;
  --drive:#3987e5;--play:#d95926;--meal:#199e70;--log:#c98500;--fly:#9085e9;--rest:#5a5a56;--route-dim:#6a6a66;--stay:#6aa0d8}}
:root[data-theme="dark"]{
  --bg:#1a1a19;--panel:#222221;--line:#3a3a37;--ink:#fff;--ink2:#c3c2b7;--ink3:#8f8e88;--card:#262625;
  --drive:#3987e5;--play:#d95926;--meal:#199e70;--log:#c98500;--fly:#9085e9;--rest:#5a5a56;--route-dim:#6a6a66;--stay:#6aa0d8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;color:var(--ink);background:var(--bg);font-size:13px}
#app{display:grid;height:100%;grid-template-rows:auto 1fr auto;grid-template-columns:400px 1fr;grid-template-areas:"top top" "side map" "gantt gantt"}
#top{grid-area:top;display:flex;align-items:center;gap:14px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
#top h1{font-size:16px;margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--ink2);padding:5px 10px;cursor:pointer;font-size:12.5px}
.seg button.on{background:var(--ink);color:var(--bg)}
#days{display:flex;gap:4px;flex-wrap:wrap}
#days button{border:1px solid var(--line);background:var(--card);color:var(--ink2);border-radius:14px;padding:3px 9px;cursor:pointer;font-size:12px}
#days button.on{background:var(--stay);border-color:var(--stay);color:#fff}
#side{grid-area:side;overflow:auto;padding:14px 16px;background:var(--panel);border-right:1px solid var(--line);line-height:1.5}
#side h2{font-size:15px;margin:0 0 2px}
#side .sub{color:var(--ink2);margin:0 0 10px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.kpi div{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.kpi b{display:block;font-size:16px}.kpi span{color:var(--ink3);font-size:11px}
.sched{list-style:none;padding:0;margin:0}
.sched li{display:grid;grid-template-columns:86px 10px 1fr;gap:8px;padding:6px 4px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:4px}
.sched li:hover,.sched li.hl{background:var(--card)}
.sched .t{color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap;font-size:12px}
.sched .dot{width:10px;height:10px;border-radius:3px;margin-top:4px}
.sched .n{color:var(--ink3);font-size:12px}
.note{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:10px 0;color:var(--ink2)}
#map{grid-area:map;min-height:0}
#gantt{grid-area:gantt;border-top:1px solid var(--line);background:var(--panel);padding:6px 16px 10px;overflow:auto;max-height:42vh}
#gantt h3{font-size:12.5px;margin:4px 0 6px;color:var(--ink2);font-weight:600;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.lg{display:inline-flex;align-items:center;gap:4px;font-weight:400}.lg i{width:12px;height:12px;border-radius:3px;display:inline-block}
.grow{display:grid;grid-template-columns:170px 1fr;align-items:center;gap:8px;height:24px;margin:2px 0;cursor:pointer;border-radius:4px}
.grow:hover{background:var(--card)}.grow.on .lab{color:var(--ink);font-weight:600}
.grow .lab{font-size:12px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.grow .bar{position:relative;height:18px;background:var(--card);border-radius:3px}
.grow.on .bar{outline:2px solid var(--stay);outline-offset:1px}
.blk{position:absolute;top:0;height:18px;border-radius:3px;border:2px solid var(--bg);border-width:0 1px;overflow:hidden;color:#fff;font-size:10.5px;line-height:18px;padding:0 4px;white-space:nowrap;text-overflow:ellipsis}
.blk.dirt{background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.28) 0 3px,transparent 3px 7px)}
.blk.hl{outline:2px solid var(--ink);z-index:2}
.axis{display:grid;grid-template-columns:170px 1fr;gap:8px;margin-bottom:2px}
.axis .ticks{position:relative;height:14px}
.axis .ticks span{position:absolute;transform:translateX(-50%);font-size:10px;color:var(--ink3)}
.grid{position:absolute;inset:0;pointer-events:none}
.grid i{position:absolute;top:0;bottom:0;width:1px;background:var(--line)}
#cost{position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px}
#cost[hidden]{display:none}
.cost-box{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:14px 18px 18px}
.cost-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:15px}
.cost-box .x{border:0;background:none;font-size:22px;cursor:pointer;color:var(--ink2)}
.cost-box table{border-collapse:collapse;width:100%;font-size:12.5px;margin:6px 0 12px}
.cost-box th,.cost-box td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.cost-box th{background:var(--panel);font-weight:600}
.cost-box .tbd{color:var(--ink3);font-style:italic}
.cost-box .meta{color:var(--ink3);font-size:11.5px}
#tip{position:fixed;z-index:9999;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 9px;border-radius:5px;font-size:12px;max-width:280px;display:none;line-height:1.4}
#map{--pic:28px}
.pic{position:absolute;left:0;top:0;transform:translate(-50%,-50%);width:var(--pic);height:var(--pic);border-radius:6px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.45);overflow:hidden;background:#ddd;cursor:pointer;transition:width .25s,height .25s}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic.dim{opacity:.55;filter:grayscale(.6)}
.pic.big{width:300px;height:auto;transition:none;border-radius:8px;opacity:1;filter:none;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.45);cursor:zoom-out}
.pic.big img{height:200px}
.pic.big:hover{transform:translate(-50%,-50%)}
.pic .cap{display:none}
.pic.big .cap{display:block;padding:6px 9px 8px;font-size:12px;line-height:1.4;color:#222}
.pic.big .cap b{font-size:13px}
.pic.big .cap a{color:#1f4e79}
.pic:hover{transform:translate(-50%,-50%) scale(1.15);z-index:5;border-color:var(--stay)}
.leaflet-marker-icon.picwrap{overflow:visible}
.num{display:inline-block;width:20px;height:20px;border-radius:50%;background:var(--stay);color:#fff;font-size:11px;text-align:center;line-height:20px;font-weight:bold;box-shadow:0 0 0 2px #fff}
.num.dim{opacity:.45}
.leaflet-popup-content{margin:10px 12px;font-size:12.5px}
.legend{background:#fff;color:#222;padding:6px 10px;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.3);font-size:12px;line-height:1.7}
.legtag{background:#fff;border:1px solid var(--drive);color:var(--drive);font-weight:bold;font-size:11px;padding:0 5px;border-radius:4px;white-space:nowrap}
@media (max-width:860px){#app{grid-template-columns:1fr;grid-template-rows:auto 42vh 1fr auto;grid-template-areas:"top" "map" "side" "gantt"}#side{border-right:0;border-top:1px solid var(--line)}#gantt{max-height:34vh}.grow{grid-template-columns:110px 1fr}.axis{grid-template-columns:110px 1fr}}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <h1>美西南自驾 · 12/24 → 1/3</h1>
    <div class="seg" id="plans"></div>

  <div id="side"></div>
  <div id="map"></div>

</div>

const usd=v=>v==null?'<span class="tbd">待查</span>':(typeof v==="number"?"$"+v.toLocaleString(undefined,{maximumFractionDigits:0}):v);
function renderCost(){
  const body=document.getElementById("costBody");
  body.innerHTML=Object.values(RENTAL).map(r=>`<h3 style="font-size:13.5px;margin:10px 0 2px">${r.title}</h3>
   <table><tr><th style="width:42%">项目</th><th style="width:16%">金额</th><th>说明</th></tr>
   ${r.rows.map(x=>`<tr><td>${x.k}</td><td>${usd(x.v)}</td><td class="meta">${x.note||""}</td></tr>`).join("")}
   ${r.compare?`<tr><td><i>${r.compare.k}</i></td><td>${usd(r.compare.v)}</td><td class="meta">${r.compare.note}</td></tr>`:""}</table>
   <div class="meta">${r.quotedOn?"报价日期 "+r.quotedOn:"尚未查询报价"}</div>`).join("")+
   `<div class="meta" style="margin-top:10px">说明：Avis 公开价和谷歌员工租车 portal 的企业价不同，portal 价以用户自己跑的报价为准。Enterprise / National 机场之间的 one-way 通常不收 drop charge，可作对照。</div>`;
}
document.getElementById("guideBtn").onclick=()=>open("guide.html","_blank");
document.getElementById("costBtn").onclick=()=>{renderCost();document.getElementById("cost").hidden=false};
document.getElementById("costClose").onclick=()=>document.getElementById("cost").hidden=true;
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.getElementById("cost").hidden=true});
document.getElementById("cost").addEventListener("click",e=>{if(e.target.id==="cost")e.target.hidden=true});

/* ===================== 工具 ===================== */
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const hm=s=>{const [h,m]=s.split(":").map(Number);return h+m/60};
const span=t=>t.split("-").map(hm);
const fmtH=h=>{const x=Math.round(h*4)/4;return x%1===0?x+" h":x.toFixed(2).replace(/\.?0+$/,"")+" h"};
const X0=7,X1=22; // 时间轴 07:00–22:00（12/28 晚拍星空到 21:30）
const dayLegs=d=>d.blocks.flatMap(b=>b.leg||[]);
const dayMi=d=>dayLegs(d).reduce((s,l)=>s+(ROUTES[l]?ROUTES[l].mi:0),0);
const dayDriveH=d=>d.blocks.filter(b=>b.type==="drive"||b.type==="dirt").reduce((s,b)=>{const [a,z]=span(b.t);return s+z-a},0);

/* ===================== 状态 ===================== */
const q=new URLSearchParams(location.search);
let plan=q.get("plan")in PLANS?q.get("plan"):"orig";
let dayIdx=q.has("day")?Number(q.get("day")):-1;   // -1 = 全程
const tip=document.getElementById("tip");
function showTip(e,html){tip.innerHTML=html;tip.style.display="block";moveTip(e)}
function moveTip(e){const w=tip.offsetWidth,h=tip.offsetHeight;tip.style.left=Math.min(e.clientX+14,innerWidth-w-8)+"px";tip.style.top=Math.min(e.clientY+14,innerHeight-h-8)+"px"}
function hideTip(){tip.style.display="none"}

/* ===================== 地图 ===================== */
const map=L.map("map",{zoomControl:true}).setView([34.6,-108.5],6);
new ResizeObserver(()=>map.invalidateSize({animate:false})).observe(document.getElementById("map"));
const attribOSM='&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';
const esri=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Tiles &copy; Esri &mdash; Esri, USGS, NOAA, "+attribOSM});
const esriStreet=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Tiles &copy; Esri &mdash; Esri, HERE, Garmin, "+attribOSM});
const esriSat=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",{maxZoom:19,attribution:"Tiles &copy; Esri &mdash; Esri, Maxar, Earthstar Geographics"});
const topo=L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",{subdomains:"abc",maxZoom:17,attribution:attribOSM+", SRTM | &copy; OpenTopoMap (CC-BY-SA)"});
const osm=L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:attribOSM});
// 路线几何来自 OSRM（OpenStreetMap 路网），用 OSM 底图才能和道路完全贴合；Esri 底图是另一套数据，放大后会偏几十米。
// OSM 瓦片对本地 file:// 打开（无 Referer）返回 403，所以本地默认 Esri，线上默认 OSM。
const LOCAL=location.protocol==="file:";
(LOCAL?esri:osm).addTo(map);
let esriErr=0;esri.on("tileerror",()=>{if(++esriErr>=4&&map.hasLayer(esri)){map.removeLayer(esri);topo.addTo(map)}});
let osmErr=0;osm.on("tileerror",()=>{if(++osmErr>=4&&map.hasLayer(osm)){map.removeLayer(osm);esri.addTo(map)}});
L.control.layers({"OpenStreetMap（与路线同源，放大最准）":osm,"Esri 地形":esri,"Esri 街道":esriStreet,"卫星图":esriSat,"OpenTopoMap":topo},null,{position:"topright"}).addTo(map);
const casingLayer=L.layerGroup().addTo(map), routeLayer=L.layerGroup().addTo(map), poiLayer=L.layerGroup().addTo(map), hlLayer=L.layerGroup().addTo(map);
const lineW=()=>map.getZoom()>=13?8:map.getZoom()>=10?6:5;   // 当天路线线宽随缩放加粗
const picSize=()=>Math.min(96,Math.max(24,Math.round(28*Math.pow(1.4,map.getZoom()-6))));
const applyPicSize=()=>document.getElementById("map").style.setProperty("--pic",picSize()+"px");
applyPicSize();
map.on("zoomend",()=>{applyPicSize();const w=lineW();routeLayer.eachLayer(l=>{if(l._dayOn)l.setStyle({weight:w})});casingLayer.eachLayer(l=>l.setStyle({weight:w+4}))});
const legend=L.control({position:"bottomleft"});
legend.onAdd=()=>{const d=L.DomUtil.create("div","legend");d.innerHTML=`<span style="color:${css("--drive")}">━</span> 当天路线（OSM 路网，OSRM 计算）&nbsp; <span style="color:${css("--drive")}">┅</span> 土路 &nbsp; <span style="color:${css("--fly")}">┅</span> 航班<br><span style="color:${css("--route-dim")}">━</span> 其他天 &nbsp; <span class="num" style="width:16px;height:16px;line-height:16px;font-size:10px;box-shadow:none">1</span> 住宿 &nbsp; <span style="display:inline-block;width:12px;height:12px;border:2px solid #fff;border-radius:3px;background:#b08860;box-shadow:0 0 0 1px #999;vertical-align:-2px"></span> 景点缩略图（随缩放变大；点一下原地展开，再点收回）`;return d};
legend.addTo(map);

function arc(a,b){const r=[];for(let i=0;i<=40;i++){const t=i/40;r.push([a[0]+(b[0]-a[0])*t+Math.sin(Math.PI*t)*1.0,a[1]+(b[1]-a[1])*t])}return r}
function legLine(id,opts){const r=ROUTES[id];if(!r)return null;return L.polyline(r.c,opts)}

function draw(){
  bigPic=null;routeLayer.clearLayers();casingLayer.clearLayers();poiLayer.clearLayers();hlLayer.clearLayers();const W=lineW();
  const P=PLANS[plan];const dimC=css("--route-dim"),drC=css("--drive"),flC=css("--fly");
  const bounds=[];
  // 其他天：灰色细线；当天：彩色粗线
  [false,true].forEach(pass=>P.days.forEach((d,i)=>{
    const on=dayIdx===-1||dayIdx===i; if(on!==pass)return;   // 第一轮画其他天的灰线，第二轮画当天
    d.blocks.forEach(b=>{
      (b.leg||[]).forEach(id=>{
        const pl=legLine(id,on?{color:drC,weight:W,opacity:1,dashArray:DIRT.has(id)?"6 10":null,lineCap:"round",lineJoin:"round"}:{color:dimC,weight:4,opacity:.55});
        if(!pl)return;pl._dayOn=on;
        pl.on("click",e=>{L.DomEvent.stop(e);if(dayIdx!==i)select(i);else focusBlock(b)});
        if(on){legLine(id,{color:"#fff",weight:W+4,opacity:.9,lineCap:"round",lineJoin:"round",interactive:false}).addTo(casingLayer);bounds.push(...pl.getLatLngs())}
        pl.addTo(routeLayer);  // 描边先画、彩色线后画，保证线在描边之上
        const r=ROUTES[id];
        pl.bindTooltip(`<b>${b.title}</b><br>D${i+1} ${d.date} ${b.t}<br>${r.mi} mi · OSRM 估 ${fmtH(r.h)}（偏保守）<br><span style="color:#888">${dayIdx===i?"点击：聚焦这段":"点击：切换到这天"}</span>`,{sticky:true});
        pl.on("mouseover",()=>pl.setStyle({weight:on?lineW()+3:6,opacity:1}));pl.on("mouseout",()=>pl.setStyle({weight:on?lineW():4,opacity:on?1:.55}));
      });
      if(b.fly){const a=arc(POI[b.fly[0]].ll,POI[b.fly[1]].ll);const pl=L.polyline(a,{color:on?flC:dimC,weight:on?3:3,dashArray:"8 7",opacity:.9}).addTo(routeLayer);pl.bindTooltip(`<b>${b.title}</b><br>D${i+1} ${d.date} ${b.t}<br><span style="color:#888">${dayIdx===i?"点击：聚焦":"点击：切换到这天"}</span>`,{sticky:true});pl.on("click",e=>{L.DomEvent.stop(e);if(dayIdx!==i)select(i);else focusBlock(b)});if(on)bounds.push(...a)}
    });
  }));
  // 住宿点编号
  const stays=[];P.days.forEach((d,i)=>{const prev=stays[stays.length-1];if(!d.stay.startsWith("—")&&(!prev||prev.stay!==d.stay))stays.push({stay:d.stay,i,ds:[i]});else if(prev&&prev.stay===d.stay)prev.ds.push(i)});
  const stayPoi=s=>Object.values(POI).find(p=>p.kind==="stay"&&(s.startsWith(p.n)||p.n.startsWith(s.split(" ")[0])));
  stays.forEach((s,k)=>{const p=stayPoi(s.stay);if(!p)return;const on=dayIdx===-1||s.ds.includes(dayIdx);
    L.marker(p.ll,{icon:L.divIcon({className:"",html:`<span class="num ${on?"":"dim"}">${k+1}</span>`,iconSize:[20,20],iconAnchor:[10,10]}),zIndexOffset:500})
     .addTo(poiLayer).bindPopup(`<b>${k+1} · ${s.stay}</b><br>${s.ds.map(i=>P.days[i].date).join("、")}（${s.ds.length} 晚）`);
    if(on)bounds.push(p.ll)});
  // 景点
  const seen=new Set();
  P.days.forEach((d,i)=>{const on=dayIdx===-1||dayIdx===i;d.blocks.forEach(b=>{if(!b.poi||seen.has(b.poi+on))return;const p=POI[b.poi];if(p.kind)return;seen.add(b.poi+on);
    const when=P.days.flatMap((dd,j)=>dd.blocks.filter(x=>x.poi===b.poi&&x.type==="play").map(x=>`${dd.date} ${x.t}`)).join("<br>");
    let m;
    if(p.img){
      m=L.marker(p.ll,{icon:L.divIcon({className:"picwrap",html:`<div class="pic ${on?"":"dim"}" title="${p.n}"><img src="images/mini/${p.img}.jpg" alt=""><div class="cap"><b>${p.n}</b><br><span style="color:#777">${when}</span><br><a href="guide.html#${b.poi}" target="_blank" style="font-weight:600">📖 攻略 ↗</a> &nbsp;·&nbsp; <a href="images/${p.img}.jpg" target="_blank">查看原图 ↗</a></div></div>`,iconSize:[0,0],iconAnchor:[0,0]}),zIndexOffset:on?300:100}).addTo(poiLayer);
      m.on("click",e=>{L.DomEvent.stop(e);const el=m.getElement().querySelector(".pic");
        if(bigPic&&bigPic.el===el){collapsePic();return}
        collapsePic();el.classList.add("big");el.querySelector("img").src=`images/thumbs/${p.img}.jpg`;m.setZIndexOffset(2000);
        bigPic={el,m,img:p.img,z:on?300:100}});
    }else{
      m=L.circleMarker(p.ll,{radius:on?7:5,color:"#fff",weight:1.5,fillColor:on?"#2e7d32":"#8a8984",fillOpacity:.95}).addTo(poiLayer);
      m.bindPopup(`<b>${p.n}</b><br><span style="color:#777">${when}</span>`);
    }
    if(on)bounds.push(p.ll)})});
  map.invalidateSize({animate:false});   // 侧栏/时间轴渲染后容器高度会变，先重新量尺寸再缩放
  if(bounds.length)map.fitBounds(L.latLngBounds(bounds),{padding:[40,40],maxZoom:11});
}
let bigPic=null;   // 当前展开的景点图，同一时间只有一张
function collapsePic(){if(!bigPic)return;const {el,m,img,z}=bigPic;el.classList.remove("big");el.querySelector("img").src=`images/mini/${img}.jpg`;m.setZIndexOffset(z);bigPic=null}
map.on("click",collapsePic);
function highlight(b,on){
  hlLayer.clearLayers();if(!on||!b)return;
  (b.leg||[]).forEach(id=>{const pl=legLine(id,{color:css("--ink"),weight:9,opacity:.35});if(pl)pl.addTo(hlLayer)});
  if(b.poi){const p=POI[b.poi];L.circleMarker(p.ll,{radius:16,color:css("--ink"),weight:2,fill:false}).addTo(hlLayer)}
  if(b.fly){L.polyline(arc(POI[b.fly[0]].ll,POI[b.fly[1]].ll),{color:css("--ink"),weight:8,opacity:.3}).addTo(hlLayer)}
}
function focusBlock(b){
  map.invalidateSize({animate:false});
  if(b.leg&&b.leg.length){const pts=b.leg.flatMap(id=>ROUTES[id]?ROUTES[id].c:[]);if(pts.length)map.fitBounds(L.latLngBounds(pts),{padding:[40,40]})}
  else if(b.poi){map.setView(POI[b.poi].ll,Math.max(map.getZoom(),11))}
  else if(b.fly){map.fitBounds(L.latLngBounds(arc(POI[b.fly[0]].ll,POI[b.fly[1]].ll)),{padding:[40,40]})}
}

/* ===================== 侧栏 ===================== */
function renderSide(){
  const P=PLANS[plan];const el=document.getElementById("side");
  if(dayIdx===-1){
    const mi=P.days.reduce((s,d)=>s+dayMi(d),0),h=P.days.reduce((s,d)=>s+dayDriveH(d),0);
    const nights=P.days.length-1;
    el.innerHTML=`<h2>${P.name}</h2><p class="sub">2026-12-24 → 2027-01-03 · ${nights} 晚 · 全程 MST 无时差</p>
    <div class="kpi"><div><b>${Math.round(mi).toLocaleString()} mi</b><span>真实道路里程（OSRM）</span></div><div><b>${fmtH(h)}</b><span>计划开车时间</span></div><div><b>${P.days.filter(d=>d.blocks.some(b=>b.type==="play")).length} 天</b><span>有游玩安排</span></div></div>
    <div class="note">点上方日期、下方时间轴，或<b>直接点地图上的任一段路线</b>，都能切到那一天：地图只高亮那天的路线和景点，侧栏列出分时段安排。悬停时间块会在地图上定位。</div>
    <ul class="sched">${P.days.map((d,i)=>`<li data-day="${i}"><span class="t">${d.date} 周${d.dow}</span><span class="dot" style="background:var(--stay)"></span><span><b>${d.stay}</b><br><span class="n">${Math.round(dayMi(d))} mi · 开车 ${fmtH(dayDriveH(d))} · 日落 ${d.sunset}</span></span></li>`).join("")}</ul>`;
    el.querySelectorAll("li").forEach(li=>li.onclick=()=>select(Number(li.dataset.day)));
    return;
  }
  const d=P.days[dayIdx];
  el.innerHTML=`<h2>D${dayIdx+1} · ${d.date} 周${d.dow}</h2><p class="sub">住 ${d.stay} · 日落约 ${d.sunset}</p>
  <div class="kpi"><div><b>${Math.round(dayMi(d))} mi</b><span>真实道路里程</span></div><div><b>${fmtH(dayDriveH(d))}</b><span>计划开车</span></div><div><b>${fmtH(d.blocks.filter(b=>b.type==="play").reduce((s,b)=>{const [a,z]=span(b.t);return s+z-a},0))}</b><span>游玩</span></div></div>
  ${d.note?`<div class="note">${d.note}</div>`:""}
  <ul class="sched">${d.blocks.map((b,j)=>`<li data-j="${j}"><span class="t">${b.t.replace("-","–")}</span><span class="dot" style="background:var(${TYPE[b.type][1]})"></span><span>${b.title}${b.n?`<br><span class="n">${b.n}</span>`:""}${b.leg?`<br><span class="n">${b.leg.map(id=>ROUTES[id]?ROUTES[id].mi+" mi":"").join(" + ")}</span>`:""}</span></li>`).join("")}</ul>`;
  el.querySelectorAll("li").forEach(li=>{const b=d.blocks[li.dataset.j];
    li.onmouseenter=()=>{highlight(b,true);li.classList.add("hl")};li.onmouseleave=()=>{highlight(null);li.classList.remove("hl")};li.onclick=()=>focusBlock(b)});
}

/* ===================== 时间轴（甘特） ===================== */
function renderGantt(){
  const P=PLANS[plan];const g=document.getElementById("gantt");
  const pct=h=>((h-X0)/(X1-X0)*100);
  let html=`<h3>每日分时段 ${Object.entries(TYPE).map(([k,[n,v]])=>`<span class="lg"><i style="background:var(${v});${k==="dirt"?"background-image:repeating-linear-gradient(135deg,rgba(255,255,255,.35) 0 2px,transparent 2px 5px)":""}"></i>${n}</span>`).join("")}</h3>`;
  html+=`<div class="axis"><span></span><div class="ticks">${Array.from({length:X1-X0+1},(_,i)=>`<span style="left:${pct(X0+i)}%">${X0+i}:00</span>`).join("")}</div></div>`;
  P.days.forEach((d,i)=>{
    html+=`<div class="grow ${dayIdx===i?"on":""}" data-day="${i}"><div class="lab">D${i+1} ${d.date} 周${d.dow} · ${d.stay}</div><div class="bar"><div class="grid">${Array.from({length:X1-X0+1},(_,k)=>`<i style="left:${pct(X0+k)}%"></i>`).join("")}</div>`;
    d.blocks.forEach((b,j)=>{const [a,z]=span(b.t);const l=Math.max(pct(a),0),r=Math.min(pct(z),100);if(r<=l)return;
      html+=`<div class="blk ${b.type==="dirt"?"dirt":""}" data-day="${i}" data-j="${j}" style="left:${l}%;width:${r-l}%;background:var(${TYPE[b.type][1]})">${b.title}</div>`});
    html+=`</div></div>`;
  });
  g.innerHTML=html;
  g.querySelectorAll(".grow").forEach(r=>r.onclick=()=>select(Number(r.dataset.day)));
  g.querySelectorAll(".blk").forEach(el=>{const b=P.days[el.dataset.day].blocks[el.dataset.j];
    el.onmouseenter=e=>{showTip(e,`<b>${b.title}</b><br>${P.days[el.dataset.day].date} ${b.t.replace("-","–")} · ${TYPE[b.type][0]}${b.n?"<br>"+b.n:""}${b.leg?"<br>"+b.leg.map(id=>ROUTES[id]?ROUTES[id].mi+" mi":"").join(" + "):""}`);el.classList.add("hl");if(dayIdx===-1||dayIdx==el.dataset.day)highlight(b,true)};
    el.onmousemove=moveTip;el.onmouseleave=()=>{hideTip();el.classList.remove("hl");highlight(null)};
    el.onclick=e=>{e.stopPropagation();if(dayIdx!=el.dataset.day)select(Number(el.dataset.day));focusBlock(b)}});
}

/* ===================== 顶栏 / 选择 ===================== */
function renderTop(){
  document.getElementById("plans").innerHTML=Object.entries(PLANS).map(([k,p])=>`<button class="${k===plan?"on":""}" data-p="${k}">${p.name}</button>`).join("");
  document.querySelectorAll("#plans button").forEach(b=>b.onclick=()=>{plan=b.dataset.p;dayIdx=Math.min(dayIdx,PLANS[plan].days.length-1);renderAll()});
  const P=PLANS[plan];
  document.getElementById("days").innerHTML=`<button class="${dayIdx===-1?"on":""}" data-d="-1">全程</button>`+P.days.map((d,i)=>`<button class="${dayIdx===i?"on":""}" data-d="${i}">${d.date}</button>`).join("");
  document.querySelectorAll("#days button").forEach(b=>b.onclick=()=>select(Number(b.dataset.d)));
}
function select(i){dayIdx=i;renderAll()}
function renderAll(){renderTop();renderSide();renderGantt();draw();history.replaceState(null,"",`?plan=${plan}${dayIdx>=0?"&day="+dayIdx:""}`)}
document.getElementById("themeBtn").onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=dark?"light":"dark";renderAll()};
renderAll();
</script>
</body>
</html>
